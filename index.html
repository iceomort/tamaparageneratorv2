<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamagotchi Paradise Genes Generator</title>
<style>
:root {
  --bg: #ffffff;
  --bg-2: #f0f2f6;
  --text: #31333f;
  --muted: #6b6f7b;
  --border: rgba(49, 51, 63, 0.2);
  --card: rgba(49, 51, 63, 0.04);
  --card-hover: rgba(49, 51, 63, 0.10);
  --accent: #6366f1;
  --accent-soft: rgba(99, 102, 241, 0.2);
  --accent-text: #4f46e5;
  --danger: #dc3232;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1117;
    --bg-2: #262730;
    --text: #fafafa;
    --muted: #9ca0ab;
    --border: rgba(250, 250, 250, 0.2);
    --card: rgba(255, 255, 255, 0.04);
    --card-hover: rgba(255, 255, 255, 0.10);
    --accent-text: #a5b4fc;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
img, canvas { image-rendering: pixelated; }

/* header */
header { text-align: center; padding: 8px 0 4px; }
.title-row { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.title-row h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: 0.02em; }
.title-row canvas { width: 56px; height: 56px; }
.credit { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
a { color: var(--accent-text); }

/* panels */
.panel { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 16px 0; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 16px; }
.grid-4 + .grid-4 { margin-top: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; }
label.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }

/* buttons */
button { font: inherit; color: inherit; }
.btn {
  width: 100%;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* picker */
.picker-header { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.selected-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 20px;
  font-size: 13px; font-weight: 600;
  color: var(--accent-text);
  margin-bottom: 8px;
}
.selected-badge canvas { width: 24px; height: 24px; }
details.picker { border: 1px solid var(--border); border-radius: 8px; }
details.picker summary { cursor: pointer; padding: 8px 12px; font-size: 15px; }
.tama-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; padding: 8px 12px 12px; max-height: 420px; overflow-y: auto; }
.mood-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; }
.mood-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
.chip { padding: 4px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.chip-n { opacity: 0.65; font-weight: 400; margin-left: 2px; }
.badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.badge-row .selected-badge { margin-bottom: 0; }
.dice-btn { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.dice-btn:hover { border-color: var(--accent); background: var(--card-hover); }
.pick-opts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 0; }
.pick-search-wrap { padding: 8px 12px 0; }
.pick-search { width: 100%; padding: 8px 12px; font: inherit; font-size: 15px; color: var(--text); background: var(--bg-2); border: 1px solid transparent; border-radius: 8px; }
.pick-search:focus { border-color: var(--accent); outline: none; }
.pick-empty { padding: 4px 12px 12px; font-size: 14px; color: var(--muted); margin: 0; }
@media (max-width: 760px) { .tama-grid { max-height: 62vh; } }
.tama-card {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 4px;
  border-radius: 8px;
  border: 2px solid transparent;
  background: var(--card);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.tama-card:hover { background: var(--card-hover); border-color: var(--border); }
.tama-card.selected { background: var(--accent-soft); border-color: var(--accent); }
.tama-card canvas { width: 40px; height: 40px; }
.tama-card canvas.eyes-thumb { width: 88px; height: 44px; max-width: 100%; }
.tama-grid.eyes-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.selected-badge canvas.eyes-thumb { width: 44px; height: 22px; }
.tama-card .label { font-size: 9px; text-align: center; line-height: 1.2; color: var(--muted); word-break: break-word; }
.tama-card.selected .label { color: var(--accent-text); font-weight: 700; }

/* colour row */
.color-row { display: grid; grid-template-columns: 4fr 1fr; gap: 12px; align-items: end; margin-top: 16px; }
.color-row label { display: block; font-size: 14px; margin-bottom: 4px; }
select {
  width: 100%; padding: 8px 12px; font: inherit; color: var(--text);
  background: var(--bg-2); border: 1px solid transparent; border-radius: 8px;
}
select:hover { border-color: var(--accent); }

/* colour picker */
canvas.swatch { width: 24px; height: 32px; flex: none; border-radius: 4px; }
.selected-badge canvas.swatch { width: 12px; height: 16px; border-radius: 2px; }
.color-list { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 12px; max-height: 480px; overflow-y: auto; }
.color-item {
  display: grid; grid-template-columns: 24px 96px 1fr; gap: 12px; align-items: center;
  width: 100%; text-align: left;
  padding: 6px 8px; border-radius: 8px;
  border: 2px solid transparent; background: var(--card); cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.color-item:hover { background: var(--card-hover); border-color: var(--border); }
.color-item.selected { background: var(--accent-soft); border-color: var(--accent); }
.color-item .cname { font-size: 14px; font-weight: 600; }
.color-item.selected .cname { color: var(--accent-text); }
.cthumbs { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; min-height: 32px; }
.cthumbs canvas { width: 36px; height: 36px; }
.cnone { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { .color-item { grid-template-columns: 24px 1fr; } .color-item .cthumbs { grid-column: 1 / -1; } }

/* preview */
.preview { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
.preview .small canvas { width: 160px; height: auto; max-width: 100%; }
.preview .large canvas { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
.caption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.caption strong { color: var(--text); }

/* history */
h2 { font-size: 1.75rem; margin: 32px 0 12px; font-weight: 700; }
.history-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.history-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.history-item { font-size: 12px; }
.history-item canvas { width: 96px; max-width: 100%; height: auto; display: block; margin: 4px 0; }
.history-item .cap { color: var(--muted); line-height: 1.3; }
.history-item .cap span { display: block; }
.history-item .cap .cap-name { color: var(--text); font-weight: 600; }
.empty { color: var(--muted); }

/* history: click-through to the growing guide */
.hist-hint { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
button.hist-open { display: block; padding: 0; margin: 4px 0; border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; }
button.hist-open:hover { border-color: var(--accent); background: var(--card); }
button.hist-open canvas { margin: 0; }

/* favourites */
.section-tabs { display: flex; gap: 16px; align-items: baseline; margin: 32px 0 12px; }
.section-tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 0 2px 4px; font-size: 1.5rem; font-weight: 700; color: var(--muted); cursor: pointer; }
.section-tabs button:hover { color: var(--text); }
.section-tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
.heart, .pencil { display: inline-flex; vertical-align: middle; padding: 2px; border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 50%; }
.heart svg, .pencil svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.heart.mini svg, .pencil.mini svg { width: 15px; height: 15px; }
.pencil svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pencil:hover { color: var(--accent-text); }
.heart:hover { color: #ef4466; }
.heart[aria-pressed="true"] { color: #ef4466; }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.guide-name { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.guide-name h3 { margin: 0; }
.rename-row { margin-bottom: 4px; }
.fav-input { width: 100%; padding: 4px 8px; font: inherit; font-size: 13px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--text); }
.mini-btn { padding: 3px 8px; margin: 6px 4px 0 0; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: pointer; }
.mini-btn:hover { border-color: var(--accent); color: var(--accent-text); }
.fav-item .cap-name { overflow-wrap: anywhere; }

/* growing guide dialog */
dialog#guide {
  width: min(560px, calc(100% - 24px)); max-height: min(86vh, 760px);
  padding: 0; border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg); color: var(--text);
}
dialog#guide::backdrop { background: rgba(0, 0, 0, 0.55); }
.guide-head { display: flex; gap: 16px; align-items: center; padding: 20px 20px 12px; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); }
.guide-head canvas { width: 96px; height: auto; flex: none; }
.guide-head h3 { margin: 0 0 4px; font-size: 1.15rem; line-height: 1.25; }
.guide-head p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.guide-close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); cursor: pointer; line-height: 1; }
.guide-close:hover { border-color: var(--accent); color: var(--accent-text); }
.guide-body { padding: 8px 20px 20px; }
.guide-body ol { margin: 8px 0 0; padding-left: 22px; }
.guide-body li { padding: 8px 0 8px 4px; }
.guide-body li::marker { color: var(--accent-text); font-weight: 700; }
.guide-body .step-title { font-weight: 600; }
.guide-body .step-hint { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.parents { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; margin-top: 8px; }
.parents .sep { align-self: center; font-size: 13px; color: var(--muted); padding: 0 2px; }
.parent { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 72px; padding: 4px 2px; border-radius: 8px; background: var(--card); }
.parent.eyes-parent { background: var(--accent-soft); }
.parent canvas { width: 40px; height: 40px; }
.parent span { font-size: 9px; line-height: 1.2; text-align: center; color: var(--muted); word-break: break-word; }
.guide-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--card); border-left: 3px solid var(--accent); }
.guide-source { margin: 16px 0 0; font-size: 12px; color: var(--muted); }

footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.loading { text-align: center; color: var(--muted); padding: 48px 0; }

@media (max-width: 760px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .grid-2, .preview { grid-template-columns: 1fr; }
  .history-grid { grid-template-columns: repeat(3, 1fr); }
  .history-actions { grid-template-columns: 1fr; }
  .title-row h1 { font-size: 1.4rem; }
}

/* ===== v4 look: cards, calmer controls, preview first ===== */
:root { --bg:#f5f6fb; --surface:#ffffff; --bg-2:#eceef6; --text:#1f2333; --muted:#6a7085; --border:rgba(31,35,51,.10); --card:rgba(31,35,51,.045); --card-hover:rgba(31,35,51,.085); --shadow:0 1px 2px rgba(20,24,40,.06),0 10px 30px rgba(20,24,40,.06); --accent:#6366f1; --accent-soft:rgba(99,102,241,.16); --accent-text:#4f46e5; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0f16; --surface:#151a26; --bg-2:#1e2433; --text:#f1f3f9; --muted:#9aa1b4; --border:rgba(255,255,255,.09); --card:rgba(255,255,255,.05); --card-hover:rgba(255,255,255,.09); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3); --accent-text:#a5b4fc; } }
main { max-width: 1180px; padding: 20px 16px 56px; }
header { padding: 4px 0 18px; }
.title-row h1 { font-size: 1.6rem; letter-spacing: -.01em; }
.title-row canvas { width: 48px; height: 48px; }
.credit { margin-top: 6px; }

.layout { display: grid; grid-template-columns: minmax(280px, 350px) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { position: sticky; top: 16px; }
.controls { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pick-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 1100px) { .pick-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 920px) { .layout { grid-template-columns: 1fr; } .stage { position: static; } }

.preview-card, .pick-card, .biomes { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.preview-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.preview-stage { border-radius: 12px; padding: 18px 12px; min-height: 250px; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 38%, var(--accent-soft), transparent 70%), var(--bg-2); }
.preview-stage canvas { width: min(100%, 260px); height: auto; max-height: 260px; image-rendering: pixelated; }
.preview-card .caption { margin: 0; text-align: center; font-size: 13px; }
.btn { background: var(--bg-2); border: 1px solid transparent; border-radius: 10px; }
.btn.primary { background: var(--accent); color: #fff; font-weight: 600; padding: 11px 14px; font-size: 15px; }
.btn.primary:hover:not(:disabled) { color: #fff; border-color: transparent; filter: brightness(1.1); }

.biomes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; }
.biomes .mood-label { padding-top: 0; }
.pick-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pick-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pick-title { margin: 0; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ftoggle { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font-size: 13px; border: 1px solid transparent; border-radius: 999px; background: var(--bg-2); cursor: pointer; }
.ftoggle:hover, .ftoggle[aria-expanded="true"] { border-color: var(--accent); }
.ftoggle.on { color: var(--accent-text); }
.fcount { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge-row { margin: 0; }
.selected-badge { padding: 5px 14px 5px 6px; font-size: 14px; font-weight: 700; }
.selected-badge canvas { width: 32px; height: 32px; }
.selected-badge canvas.eyes-thumb { width: 60px; height: 30px; }
.selected-badge canvas.swatch { width: 16px; height: 22px; }
.dice-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--bg-2); border: 1px solid transparent; font-size: 19px; }
.dice-btn:hover { border-color: var(--accent); background: var(--card-hover); }

.filters-panel { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--card); }
.mood-row { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: start; margin: 0; }
.mood-label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-top: 7px; margin: 0; font-weight: 600; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--bg-2); border: 1px solid transparent; }
.chip:hover { border-color: var(--accent); }
.tgl { position: relative; display: inline-flex; align-items: center; padding: 5px 12px; font-size: 13px; border-radius: 999px; background: var(--bg-2); border: 1px solid transparent; cursor: pointer; user-select: none; transition: background .15s, border-color .15s; }
.tgl input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.tgl:hover { border-color: var(--accent); }
.tgl:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.tgl:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

details.picker { border: 0; border-radius: 12px; background: var(--bg-2); }
details.picker summary { list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
details.picker summary::-webkit-details-marker { display: none; }
details.picker summary::after { content: '▾'; color: var(--muted); transition: transform .15s; }
details.picker[open] summary::after { transform: rotate(180deg); }
.pick-search { background: var(--surface); }
.tama-card { background: var(--surface); }
.tama-card.selected { background: var(--accent-soft); }
.tama-grid { max-height: 380px; }
.color-item { background: var(--surface); }
.color-item.selected { background: var(--accent-soft); }

.section-tabs { margin-top: 36px; }
.history-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.history-item { background: var(--surface); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
@media (max-width: 760px) { .history-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.filters-panel .chip, .filters-panel .tgl { background: var(--surface); border-color: var(--border); }
.filters-panel .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.filters-panel .tgl:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
dialog#guide { background: var(--surface); }
.guide-head { background: var(--surface); }
.guide-close { background: var(--bg-2); }
</style>
</head>
<body>
<main id="app"><div class="loading">Loading sprites…</div></main>
<dialog id="guide" aria-labelledby="guide-title"></dialog>

<script>
'use strict';

// ── Character type mapping (Land / Water / Sky / Jade) ──────────────────────
const CHAR_TYPES = {
  // LAND adults
  'MEOWTCHI': 'land', 'POCHITCHI': 'land', 'GUMAX': 'land', 'RATCHI': 'land',
  'MAMETCHI': 'land', 'MIMITCHI': 'land', 'MOLMOTCHI': 'land', 'SHEEPTCHI': 'land',
  'LEOPATCHI': 'land', 'SEBIRETCHI': 'land', 'ELIZARDOTCHI': 'land', 'HEAVYTCHI': 'land',
  'FURAWATCHI': 'land', 'POTSUNENTCHI': 'land', 'TUSTUSTCHI': 'land', 'SHIGEMI-SAN': 'land',
  'CHODRACOTCHI': 'land',
  // WATER adults
  'IRUKATCHI': 'water', 'KAMETCHI': 'water', 'KUJIRATCHI': 'water', 'URUOTCHI': 'water',
  'AXOLOPATCHI': 'water', 'IMORITCHI': 'water', 'KAWAZUTCHI': 'water', 'BEAVERTCHI': 'water',
  'TACHUTCHI': 'water', 'SHARKTCHI': 'water', 'ANKOTCHI': 'water', 'OTOTOTCHI': 'water',
  'KURARATCHI': 'water', 'MENDAKOTCHI': 'water', 'AMEFURATCHI': 'water', 'GUSOKUTCHI': 'water',
  'MERMARINTCHI': 'water',
  // SKY adults
  'HORHOTCHI': 'sky', 'MONGATCHI': 'sky', 'EAGLETCHI': 'sky', 'BATCHI': 'sky',
  'PEACOTCHI': 'sky', 'BATATCHI': 'sky', 'KUCHIPATCHI': 'sky', 'KIWITCHI': 'sky',
  'PAPILLOTCHI': 'sky', 'KABUTOTCHI': 'sky', 'TENTOTCHI': 'sky', 'HATCHITCHI': 'sky',
  'GEMTCHI': 'sky', 'ORETATCHI': 'sky', 'ISHIKOROTCHI': 'sky', 'MAGMATCHI': 'sky',
  'YAYACORNTCHI': 'sky',
  // JADE adults
  'FOREST HORHOTCHI': 'jade', 'KONKOTCHI': 'jade', 'TIGAOTCHI': 'jade', 'TANOONTCHI': 'jade',
  'LESSAPANTCHI': 'jade', 'KANOKOTCHI': 'jade', 'SUIGYUTCHI': 'jade', 'PANBOOTCHI': 'jade',
  'KACHITCHI': 'jade', 'TOKIPATCHI': 'jade', 'FOREST KUCHIPATCHI': 'jade', 'SPARROTCHI': 'jade',
  'SHIITAKETCHI': 'jade', 'PEATCHI': 'jade', 'NAPPATCHI': 'jade', 'RUSHRADITCHI': 'jade',
  'TATSUTCHI': 'jade',
};
const getCharType = c => CHAR_TYPES[c.Name.toUpperCase()] || 'other';

const HISTORY_SHOWN = 18;
const HISTORY_STORED = 100;
const APP_VERSION = 'v4.0';          // bump when you ship a change
const APP_UPDATED = '7 Oct 2026';    // and update the date here
const STORAGE_KEY = 'tamapara-history-v1';
const FAV_KEY = 'tamapara-favorites-v1';
const PENCIL_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

// ── Helpers ─────────────────────────────────────────────────────────────────
const randInt = n => Math.floor(Math.random() * n);
const choice = arr => arr[randInt(arr.length)];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Failed to load ' + src));
    img.src = src;
  });
}

// Body and mouth sprites are index maps: red channel = palette index, alpha 0 = transparent.
function readIndexMap(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  const idx = new Uint8Array(c.width * c.height);
  const opaque = new Uint8Array(c.width * c.height);
  for (let i = 0; i < idx.length; i++) {
    idx[i] = d[i * 4];
    opaque[i] = d[i * 4 + 3] ? 1 : 0;
  }
  return { width: c.width, height: c.height, idx, opaque };
}

// Replace the first 8 palette entries with the chosen colour (Colors is flattened RGBA).
function buildPalette(origRgb, colors) {
  const pal = origRgb.map(c => c.slice(0, 3));
  for (let i = 0; i < Math.floor(colors.length / 4); i++) {
    if (i < pal.length) pal[i] = [colors[i * 4], colors[i * 4 + 1], colors[i * 4 + 2]];
  }
  return pal;
}

function recolour(map, pal) {
  const c = document.createElement('canvas');
  c.width = map.width; c.height = map.height;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(map.width, map.height);
  for (let i = 0; i < map.idx.length; i++) {
    if (!map.opaque[i]) continue;
    const rgb = pal[map.idx[i]] || [0, 0, 0];
    out.data[i * 4] = rgb[0];
    out.data[i * 4 + 1] = rgb[1];
    out.data[i * 4 + 2] = rgb[2];
    out.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
  return c;
}

// ── Boot ────────────────────────────────────────────────────────────────────
async function boot() {
  const [data, palettes] = await Promise.all([
    fetch('data.json').then(r => r.json()),
    fetch('sprite-palettes.json').then(r => r.json()),
  ]);

  const sprites = {}; // Id -> { body, mouth, eyes }
  await Promise.all(data.Characters.map(async c => {
    const [b, m, e] = await Promise.all([
      loadImage(`sprites/${c.Id}_body.png`),
      loadImage(`sprites/${c.Id}_mouth.png`),
      loadImage(`images/${c.Id}_eyes.png`),
    ]);
    sprites[c.Id] = { body: readIndexMap(b), mouth: readIndexMap(m), eyes: e };
  }));

  start(data, palettes, sprites);
}

function start(data, palettes, sprites) {
  const chars = data.Characters;
  const pals = data.Palettes;
  const byId = new Map(chars.map(c => [c.Id, c]));

  // ── Compositing (mirrors generate_image in the Python version) ────────────
  function generate(body, eyes, color) {
    const drawOffset = [0, 0];
    for (const prop of ['EyePos', 'MouthPos']) {
      for (let i = 0; i < 2; i++) {
        if (body[prop][i] < drawOffset[i]) drawOffset[i] = body[prop][i];
      }
    }
    drawOffset[0] = -drawOffset[0];
    drawOffset[1] = -drawOffset[1];

    const bs = sprites[body.Id];
    const es = sprites[eyes.Id];
    const dim = [0, 0];
    for (const part of [bs.body, es.eyes, bs.mouth]) {
      dim[0] = Math.max(dim[0], part.width + drawOffset[0]);
      dim[1] = Math.max(dim[1], part.height + drawOffset[1]);
    }

    const out = document.createElement('canvas');
    out.width = dim[0]; out.height = dim[1];
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const bodyPal = buildPalette(palettes[body.Id].body, color.Colors);
    const mouthPal = buildPalette(palettes[body.Id].mouth, color.Colors);

    ctx.drawImage(recolour(bs.body, bodyPal), drawOffset[0], drawOffset[1]);
    ctx.drawImage(es.eyes, drawOffset[0] + body.EyePos[0], drawOffset[1] + body.EyePos[1]);
    ctx.drawImage(recolour(bs.mouth, mouthPal), drawOffset[0] + body.MouthPos[0], drawOffset[1] + body.MouthPos[1]);
    return out;
  }

  // Thumbnails use a character's own body, eyes and mouth in the Original palette.
  const thumbCache = new Map();
  function thumb(c) {
    if (!thumbCache.has(c.Id)) thumbCache.set(c.Id, generate(c, c, pals[0]));
    return thumbCache.get(c.Id);
  }
  // Eyes-only thumbnail: the eye sprite cropped to its pixels, on a pill in the owner's body colour.
  const EYES_W = 44, EYES_H = 22;
  const eyesThumbCache = new Map();
  function eyesThumb(c) {
    if (eyesThumbCache.has(c.Id)) return eyesThumbCache.get(c.Id);
    const img = sprites[c.Id].eyes;
    const tmp = document.createElement('canvas');
    tmp.width = img.width; tmp.height = img.height;
    const tctx = tmp.getContext('2d', { willReadFrequently: true });
    tctx.drawImage(img, 0, 0);
    const px = tctx.getImageData(0, 0, img.width, img.height).data;
    let x0 = img.width, y0 = img.height, x1 = -1, y1 = -1;
    for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) {
      if (px[(y * img.width + x) * 4 + 3]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    }
    // Body colour = most common palette index in the body sprite, ignoring transparent (0) and outline (1).
    const m = sprites[c.Id].body, counts = new Array(16).fill(0);
    for (let i = 0; i < m.idx.length; i++) if (m.opaque[i] && m.idx[i] > 1) counts[m.idx[i]]++;
    const orig = palettes[c.Id].body;
    let fillIdx = counts.indexOf(Math.max(...counts));
    // Two-tone sprites (e.g. Konkotchi, mostly white with yellow): use the sprite colour closest to
    // the colour group they belong to, so the pill matches what you look for.
    const ov = COLOUR_OVERRIDES[c.Name.toUpperCase()];
    if (ov && c.Name !== 'YAYACORNTCHI') {
      const target = hexToRgb(GROUP_HEX[ov][0]);
      let bestDist = Infinity;
      counts.forEach((n, i) => {
        if (!n || !orig[i]) return;
        const dist = target.reduce((sum, v, k) => sum + (v - orig[i][k]) ** 2, 0);
        if (dist < bestDist) { bestDist = dist; fillIdx = i; }
      });
    }
    const rgb = orig[fillIdx] || [200, 200, 200];

    const out = document.createElement('canvas');
    out.width = EYES_W; out.height = EYES_H;
    const ctx = out.getContext('2d');
    ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    const r = EYES_H / 2;
    for (let y = 0; y < EYES_H; y++) {   // stepped (non-antialiased) pill to keep the pixel look
      const dy = y + 0.5 - r;
      const inset = Math.round(r - Math.sqrt(Math.max(0, r * r - dy * dy)));
      ctx.fillRect(inset, y, EYES_W - inset * 2, 1);
    }
    if (x1 >= 0) {
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      ctx.drawImage(img, x0, y0, w, h, Math.round((EYES_W - w) / 2), Math.round((EYES_H - h) / 2), w, h);
    }

  }
  function drawInto(target, source) {
    target.width = source.width; target.height = source.height;

  }
  function canvasFrom(source) {

    drawInto(c, source);
    return c;
  }

  // Which adult characters belong to each colour, judged by how they look: the hex of the

  const GROUP_HEX = {

    'Hot Pink': ['ff82b5', 'ff5994'],
    'Purple': ['de8aff', 'ad61f7'],
    'Indigo': ['7375ef'],
    'Blue': ['4aa6ff'],
    'Teal': ['adefef', '8cd7d6'],
    'Green': ['7bdb3a'],
    'Yellow': ['ffeb52'],
    'Orange': ['ffa663', 'ffd28c'],
    'Light Pink': ['ffd2ef', 'ffb2e6'],
    'Lavender': ['b5b6ff'],
    'Sky Blue': ['73ceff', 'adebff'],
    'Light Green': ['adeb7b'],
    'Light Yellow': ['fff394', 'fffbde'],

    'SHIGEMI-SAN': 'Teal', 'NAPPATCHI': 'Light Green', 'YAYACORNTCHI': 'Purple',

  const hexToRgb = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  const GROUP_COLOURS = [];
  for (const [g, list] of Object.entries(GROUP_HEX)) for (const h of list) GROUP_COLOURS.push({ g, rgb: hexToRgb(h) });

  function colourGroupFor(c) {
    if (COLOUR_OVERRIDES[c.Name.toUpperCase()]) return COLOUR_OVERRIDES[c.Name.toUpperCase()];
    const m = sprites[c.Id].body, orig = palettes[c.Id].body;
    const counts = new Array(orig.length).fill(0);
    for (let i = 0; i < m.idx.length; i++) if (m.opaque[i] && m.idx[i] > 1) counts[m.idx[i]]++;
    const rgb = orig[counts.indexOf(Math.max(...counts))];
    let best = null, bestDist = Infinity;       // exact hex match wins; new sprites fall back to nearest
    for (const gc of GROUP_COLOURS) {
      const dist = gc.rgb.reduce((sum, v, k) => sum + (v - rgb[k]) ** 2, 0);
      if (dist < bestDist) { bestDist = dist; best = gc.g; }
    }
    return best;
  }

  const colourChars = pals.map(() => []);
  for (const c of chars) {
    if (c.Stage !== 5 || c.IsExternal || c.Name === 'BBMARUTCHI') continue; // adults only; Lab Tama and non-breedable BBMARUTCHI left out
    const pi = pals.findIndex(q => q.Name === colourGroupFor(c));
    if (pi > 0) colourChars[pi].push(c);
  }

  // Swatch: four bands (light, mid, dark, darkest) like the strips on the community colour chart.
  const swatchCache = new Map();
  function swatch(pi) {
    if (swatchCache.has(pi)) return swatchCache.get(pi);
    const cv = document.createElement('canvas');
    cv.width = 1; cv.height = 4;
    const ctx = cv.getContext('2d');
    let bands;
    if (pi === 0) { // Original: no palette of its own, so show a spread of colours
      bands = ['Red', 'Yellow', 'Green', 'Blue'].map(n => {
        const p = pals.find(q => q.Name === n);
        return p ? [p.Colors[12], p.Colors[13], p.Colors[14]] : [160, 160, 160];
      });
    } else {
      const col = pals[pi].Colors;
      bands = [2, 3, 4, 7].map(i => [col[i * 4], col[i * 4 + 1], col[i * 4 + 2]]);
    }
    bands.forEach((rgb, y) => { ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; ctx.fillRect(0, y, 1, 1); });
    swatchCache.set(pi, cv);
    return cv;
  }

  // ── State ──────────────────────────────────────────────────────────────────
  const opts = { land: true, water: true, sky: true, jade: true, nonBreedableEyes: false, externalEyes: false, nonBreedableBodies: false, externalBodies: false };
  const state = {
    body: null, eyes: null, colorIdx: 0,
    history: new Map(),        // key -> { bodyId, eyesId, colorName, canvas }
    selected: new Set(),
    favorites: new Map(),      // key -> { bodyId, eyesId, colorName, nickname, canvas }
    view: 'history',           // which saved list is showing: 'history' or 'favorites'
    renaming: null,            // key of the favourite being renamed
    search: { body: '', eyes: '' },   // text typed into each picker's search box
    mood: new Set(),           // eye style filters in use: cute, tough, sad, small (none = show all)
    stars: new Set(),          // body care-level filters in use: 4 (top care) down to 1 (6+ care mistakes)
    types: new Set(),          // body type filters in use: mammal, bird, insect, reptile, aqua, other
    filtersOpen: { body: false, eyes: false },   // whether each section's Filters panel is showing
    headerTamas: (() => {
      const adults = chars.filter(c => c.Stage === 5);
      const a = randInt(adults.length);
      let b = randInt(adults.length - 1);
      if (b >= a) b++;
      return [adults[a], adults[b]];
    })(),
  };

  // Eye styles, judged by how each set looks. Cute is the catch-all (big, kawaii or unique eyes);
  // Tough is angry looking, Sad is sad or worried looking, Small is plain dot eyes.
  const STAR_LEVELS = [
    [4, 'Top care: 5 food and 5 happy'],
    [3, '4 food and 4 happy, or 1 care mistake'],
    [2, '2 to 5 care mistakes'],
    [1, 'Bottom care: 6 or more care mistakes'],
    ['special', 'Special evolutions: connect shells during the young stage'],
  ];
  const MOODS = [
    ['cute', 'Cute', 'Big, kawaii or unique eyes'],
    ['tough', 'Tough', 'Angry looking'],
    ['sad', 'Sad', 'Sad looking'],
    ['small', 'Small', 'Dot eyes with a blank expression'],
    ['special', 'Special', 'Eyes of the special evolutions'],
  ];
  const EYES_MOOD = {};
  const addMood = (mood, names) => names.forEach(n => { EYES_MOOD[n] = mood; });
  addMood('tough', ['GUMAX', 'RATCHI', 'MOLMOTCHI', 'HEAVYTCHI', 'IMORITCHI', 'SHARKTCHI', 'GUSOKUTCHI', 'EAGLETCHI', 'KABUTOTCHI',
    'TIGAOTCHI', 'SPARROTCHI', 'SHIITAKETCHI', 'CHODRACOTCHI', 'BEAVERTCHI']);
  addMood('sad', ['SHEEPTCHI', 'LEOPATCHI', 'POTSUNENTCHI', 'BATATCHI', 'MAGMATCHI', 'SUIGYUTCHI', 'PANBOOTCHI', 'KIWITCHI']);
  addMood('small', ['TUSTUSTCHI', 'KAMETCHI', 'KUJIRATCHI', 'URUOTCHI', 'ANKOTCHI', 'OTOTOTCHI', 'AMEFURATCHI', 'BATCHI',
    'TENTOTCHI', 'HATCHITCHI', 'KUCHIPATCHI', 'ISHIKOROTCHI', 'TANOONTCHI', 'TOKIPATCHI', 'FOREST KUCHIPATCHI',
    'PEATCHI', 'NAPPATCHI', 'RUSHRADITCHI', 'TATSUTCHI',
    'POCHITCHI', 'MIMITCHI', 'SEBIRETCHI', 'IRUKATCHI', 'KURARATCHI', 'MENDAKOTCHI', 'YAYACORNTCHI']);
  // Baby, kid and young stages all share plain dot eyes; anything not listed counts as Cute.
  const eyesMood = c => (c.Stage < 5 || c.Name === 'BBMARUTCHI') ? 'small' : (EYES_MOOD[c.Name.toUpperCase()] || 'cute');
  // Special adds to a style rather than replacing it: Chodracotchi's eyes stay Tough, for example.
  const eyesTags = c => SPECIAL_GROWTH[normName(c.Name)] ? [eyesMood(c), 'special'] : [eyesMood(c)];

  function charaFilter(c) {
    const t = getCharType(c);
    if (t === 'land' && !opts.land) return false;
    if (t === 'water' && !opts.water) return false;
    if (t === 'sky' && !opts.sky) return false;
    if (t === 'jade' && !opts.jade) return false;
    if (c.IsJade && !opts.jade) return false;
    return true;
  }
  function bodyBase(c) {
    if (!opts.externalBodies && c.IsExternal) return false;
    if (!opts.nonBreedableBodies && (c.Stage < 5 || c.Name === 'BBMARUTCHI')) return false;
    return true;
  }
  // Care level from the growth charts: 4 stars needs 5 food and 5 happy, 1 star needs 6+ care mistakes.
  // Special evolutions, Bbmarutchi, non-adults and Lab Tama have no care level.
  const starsOf = c => { const g = BODY_GROWTH[normName(c.Name)]; return g ? 4 - g.tier : 0; };
  // Special evolutions (Chodracotchi, Mermarintchi, Yayacorntchi, Tatsutchi) get their own filter.
  const careOf = c => SPECIAL_GROWTH[normName(c.Name)] ? 'special' : starsOf(c);

  // Body types, as sorted by hand: what kind of creature each body is.
  // Item/Other is everything else: plants, minerals, objects, and the baby, kid and young stages.
  const BODY_TYPES = [
    ['mammal', 'Mammal', 'Cats, dogs, bears, mice and other mammals'],
    ['bird', 'Bird', 'Birds and owls'],
    ['insect', 'Insect', 'Butterflies, beetles and bees'],
    ['reptile', 'Reptile', 'Lizards, snakes, turtles and dragons'],
    ['aqua', 'Aqua', 'Sea and water creatures'],
    ['other', 'Item/Other', 'Plants, minerals, objects and everything else'],
  ];
  const BODY_TYPE = {};
  const addType = (type, names) => names.forEach(n => { BODY_TYPE[n] = type; });
  addType('mammal', ['MEOWTCHI', 'POCHITCHI', 'GUMAX', 'RATCHI', 'MAMETCHI', 'MIMITCHI', 'MOLMOTCHI', 'BEAVERTCHI', 'MONGATCHI', 'BATCHI',
    'YAYACORNTCHI', 'KONKOTCHI', 'TIGAOTCHI', 'TANOONTCHI', 'LESSAPANTCHI', 'KANOKOTCHI', 'SUIGYUTCHI', 'PANBOOTCHI', 'MEERTCHI', 'SHYONTCHI']);
  addType('bird', ['TUSTUSTCHI', 'HORHOTCHI', 'EAGLETCHI', 'KUCHIPATCHI', 'BATATCHI', 'PEACOTCHI', 'KIWITCHI', 'FOREST HORHOTCHI',
    'KACHITCHI', 'TOKIPATCHI', 'FOREST KUCHIPATCHI', 'SPARROTCHI', 'OMARUTCHI']);
  addType('insect', ['GUSOKUTCHI', 'PAPILLOTCHI', 'KABUTOTCHI', 'TENTOTCHI', 'HATCHITCHI']);
  addType('reptile', ['SEBIRETCHI', 'LEOPATCHI', 'ELIZARDOTCHI', 'HEAVYTCHI', 'KAMETCHI', 'CHODRACOTCHI', 'TATSUTCHI']);
  addType('aqua', ['IRUKATCHI', 'KUJIRATCHI', 'AXOLOPATCHI', 'IMORITCHI', 'KAWAZUTCHI', 'URUOTCHI', 'TACHUTCHI', 'SHARKTCHI', 'ANKOTCHI',
    'OTOTOTCHI', 'KURARATCHI', 'MENDAKOTCHI', 'AMEFURATCHI', 'MERMARINTCHI']);
  const typeOf = c => BODY_TYPE[c.Name.toUpperCase()] || 'other';
  const matchesCare = c => state.stars.size === 0 || state.stars.has(careOf(c));
  const matchesType = c => state.types.size === 0 || state.types.has(typeOf(c));
  function bodyFilter(c) {
    return bodyBase(c) && matchesCare(c) && matchesType(c);
  }
  function eyesBase(c) {
    if (!opts.nonBreedableEyes && (c.Stage < 5 || c.Name === 'BBMARUTCHI')) return false;
    if (!opts.externalEyes && c.IsExternal) return false;

  }

  function refreshLists() {
    const base = chars.filter(charaFilter);
    bodiesList = base.filter(bodyFilter);
    eyesList = base.filter(eyesFilter);
    if (!state.body || !bodiesList.some(c => c.Id === state.body.Id)) state.body = bodiesList[0] || null;
    if (!state.eyes || !eyesList.some(c => c.Id === state.eyes.Id)) state.eyes = eyesList[0] || null;
  }

  // ── History (kept across visits in localStorage as combo keys only) ───────
  const keyOf = (body, eyes, color) => `${body.Id}_${eyes.Id}_${color.Name}`;
  function addHistory() {

    if (!state.history.has(key)) {
      state.history.set(key, {
        bodyId: state.body.Id, eyesId: state.eyes.Id, colorName: color.Name,
        canvas: generate(state.body, state.eyes, color),
      });

    }
    return state.history.get(key);
  }
  function saveHistory() {
    try {
      const rows = [...state.history.values()].slice(-HISTORY_STORED).map(h => [h.bodyId, h.eyesId, h.colorName]);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
    } catch (e) { /* storage unavailable; history stays in memory */ }
  }
  function restoreHistory() {
    try {
      const rows = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      for (const [bodyId, eyesId, colorName] of rows) {
        const body = byId.get(bodyId), eyes = byId.get(eyesId);
        const color = pals.find(p => p.Name === colorName);

      }
    } catch (e) { /* ignore corrupt or unavailable storage */ }
  }

  // ── Favorites (kept in localStorage; the nickname is stored per combo) ────
  function saveFavorites() {
    try {
      const rows = [...state.favorites.values()].map(f => [f.bodyId, f.eyesId, f.colorName, f.nickname || '']);
      localStorage.setItem(FAV_KEY, JSON.stringify(rows));
    } catch (e) { /* storage unavailable; favorites stay in memory */ }
  }
  function restoreFavorites() {
    try {
      const rows = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
      for (const [bodyId, eyesId, colorName, nickname] of rows) {
        const body = byId.get(bodyId), eyes = byId.get(eyesId);
        const color = pals.find(p => p.Name === colorName);
        if (!body || !eyes || !color) continue;
        state.favorites.set(keyOf(body, eyes, color), { bodyId, eyesId, colorName, nickname: nickname || '', canvas: generate(body, eyes, color) });
      }
    } catch (e) { /* ignore corrupt or unavailable storage */ }
  }
  function toggleFavorite(key, entry) {
    if (state.favorites.has(key)) {
      state.favorites.delete(key);
      if (state.renaming === key) state.renaming = null;
    } else {
      const e = entry || state.history.get(key);
      if (!e) return;
      state.favorites.set(key, { bodyId: e.bodyId, eyesId: e.eyesId, colorName: e.colorName, nickname: '', canvas: e.canvas });
    }
    saveFavorites();
  }
  function saveRename(key) {
    const fav = state.favorites.get(key), input = app.querySelector('[data-rename-input]');
    if (fav && input) fav.nickname = input.value.trim().slice(0, 30);
    state.renaming = null;
    saveFavorites();
  }
  const favTitle = f => f.nickname ? `${f.nickname} the ${byId.get(f.bodyId).Name}` : byId.get(f.bodyId).Name;
  const heartBtn = (key, mini) => `<button type="button" class="heart${mini ? ' mini' : ''}" data-fav-toggle="${esc(key)}" aria-pressed="${state.favorites.has(key)}" aria-label="${state.favorites.has(key) ? 'Remove from favorites' : 'Add to favorites'}" title="${state.favorites.has(key) ? 'Remove from favorites' : 'Add to favorites'}">${HEART_SVG}</button>`;

  const editBtn = (key, mini) => `<button type="button" class="pencil${mini ? ' mini' : ''}" data-edit="${esc(key)}" aria-label="Edit this character" title="Edit this character: load it back into the editor">${PENCIL_SVG}</button>`;

  // Make sure a character is allowed by the current filters, so loading it back never gets reset.
  function allowChar(c, as) {
    const t = getCharType(c);
    if (t in opts) opts[t] = true;
    if (c.IsJade) opts.jade = true;
    if (as === 'body') {
      if (c.IsExternal) opts.externalBodies = true;
      if (c.Stage < 5 || c.Name === 'BBMARUTCHI') opts.nonBreedableBodies = true;
      if (state.types.size && !state.types.has(typeOf(c))) state.types.add(typeOf(c));
      if (state.stars.size) { const k = careOf(c); if (k && !state.stars.has(k)) state.stars.add(k); else if (!k) state.stars.clear(); }
    } else {
      if (c.Stage < 5 || c.Name === 'BBMARUTCHI') opts.nonBreedableEyes = true;
      if (c.IsExternal) opts.externalEyes = true;
      if (state.mood.size && !eyesTags(c).some(m => state.mood.has(m))) state.mood.add(eyesMood(c));
    }
  }
  // Pencil: send a saved character back to the top editor so its body, eyes or colour can be changed.
  function editEntry(key) {
    const e = state.history.get(key) || state.favorites.get(key);
    if (!e) return;
    const body = byId.get(e.bodyId), eyes = byId.get(e.eyesId);
    allowChar(body, 'body'); allowChar(eyes, 'eyes');
    state.body = body; state.eyes = eyes;
    const ci = pals.findIndex(p => p.Name === e.colorName);
    state.colorIdx = ci >= 0 ? ci : 0;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function favoritesHtml() {
    const list = [...state.favorites.entries()].reverse();
    if (!list.length) return '<div class="empty">No favorites yet. Open a character from History and tap the heart next to its name.</div>';
    return `
      <p class="hist-hint">Click a character to see how to grow it. Use Rename to give it a name.</p>
      <div class="history-grid">
        ${list.map(([k, f]) => {
          const bodyName = byId.get(f.bodyId).Name, eyesName = byId.get(f.eyesId).Name;
          const renaming = state.renaming === k;
          return `
          <div class="history-item fav-item">
            <button type="button" class="hist-open" data-guide="${esc(k)}" title="How to grow this" aria-label="How to grow ${esc(favTitle(f))}"><canvas data-fav-canvas="${esc(k)}"></canvas></button>
            <div class="cap">
              ${renaming
                ? `<div class="rename-row"><input class="fav-input" data-rename-input="${esc(k)}" value="${esc(f.nickname)}" maxlength="30" placeholder="Name it, e.g. Henry" aria-label="Nickname"><button type="button" class="mini-btn" data-fav-save="${esc(k)}">Save</button><button type="button" class="mini-btn" data-fav-cancel>Cancel</button></div>`
                : `<span class="cap-name">${esc(favTitle(f))} ${heartBtn(k, true)}${editBtn(k, true)}</span>`}
              <span>Eyes: ${esc(eyesName)}</span><span>Body: ${esc(f.colorName)}</span>
            </div>
            ${renaming ? '' : `<button type="button" class="mini-btn" data-fav-rename="${esc(k)}">✎ Rename</button>`}
          </div>`;
        }).join('')}
      </div>`;
  }

  // ── Actions ────────────────────────────────────────────────────────────────
  function randomiseSelected() {
    const entries = [...state.selected].map(k => state.history.get(k)).filter(Boolean);
    if (!entries.length) return;
    const nameOf = id => byId.get(id).Name;
    if (entries.length === 1) {
      const e = entries[0];
      const tamaBody = bodiesList.find(c => c.Name === nameOf(e.bodyId));
      const tamaEyes = eyesList.find(c => c.Name === nameOf(e.eyesId));
      const tamaColor = pals.findIndex(p => p.Name === e.colorName);
      if (Math.random() < 0.5) {
        if (tamaBody) state.body = tamaBody;
        state.eyes = choice(eyesList);
      } else {
        state.body = choice(bodiesList);
        if (tamaEyes) state.eyes = tamaEyes;
      }
      state.colorIdx = (tamaColor >= 0 && Math.random() < 0.5) ? tamaColor : randInt(pals.length);
    } else {
      const bodyPool = entries.map(e => bodiesList.find(c => c.Name === nameOf(e.bodyId))).filter(Boolean);
      const eyesPool = entries.map(e => eyesList.find(c => c.Name === nameOf(e.eyesId))).filter(Boolean);
      const colorPool = entries.map(e => pals.findIndex(p => p.Name === e.colorName)).filter(i => i >= 0);
      if (bodyPool.length) state.body = choice(bodyPool);
      if (eyesPool.length) state.eyes = choice(eyesPool);
      if (colorPool.length) state.colorIdx = choice(colorPool);
    }
  }

  // ── Rendering ──────────────────────────────────────────────────────────────
  // ── Growing guide ──────────────────────────────────────────────────────────
  // Data from the official Tamagotchi Paradise growth charts. The game has four biomes (Jade Forest,
  // Land, Water, Sky) and each young stage lists its adults from the top care tier down
  // (tier 0 = 5 food, 5 happy).
  const GROWTH_PATHS = [
    { field: 'Land', young: 'Roar Young', food: 'Meat', adults: ['MEOWTCHI', 'POCHITCHI', 'GUMAX', 'RATCHI'] },
    { field: 'Land', young: 'Toddle Young', food: 'Carrot', adults: ['MAMETCHI', 'MIMITCHI', 'MOLMOTCHI', 'SHEEPTCHI'] },
    { field: 'Land', young: 'Lick Young', food: 'Worm', adults: ['LEOPATCHI', 'SEBIRETCHI', 'ELIZARDOTCHI', 'HEAVYTCHI'] },
    { field: 'Land', young: 'Sprout Young', food: null, adults: ['FURAWATCHI', 'POTSUNENTCHI', 'TUSTUSTCHI', 'SHIGEMI-SAN'] },
    { field: 'Water', young: 'Glide Young', food: 'Seafood', adults: ['IRUKATCHI', 'KAMETCHI', 'KUJIRATCHI', 'URUOTCHI'] },
    { field: 'Water', young: 'Leap Young', food: 'Seaweed', adults: ['AXOLOPATCHI', 'IMORITCHI', 'KAWAZUTCHI', 'BEAVERTCHI'] },
    { field: 'Water', young: 'Paddle Young', food: 'Shrimp', adults: ['TACHUTCHI', 'SHARKTCHI', 'ANKOTCHI', 'OTOTOTCHI'] },
    { field: 'Water', young: 'Float Young', food: null, adults: ['KURARATCHI', 'MENDAKOTCHI', 'AMEFURATCHI', 'GUSOKUTCHI'] },
    { field: 'Sky', young: 'Flap Young', food: 'Chicken', adults: ['HORHOTCHI', 'MONGATCHI', 'EAGLETCHI', 'BATCHI'] },
    { field: 'Sky', young: 'Chirp Young', food: 'Corn', adults: ['PEACOTCHI', 'BATATCHI', 'KUCHIPATCHI', 'KIWITCHI'] },
    { field: 'Sky', young: 'Bumble Young', food: 'Syrup', adults: ['PAPILLOTCHI', 'KABUTOTCHI', 'TENTOTCHI', 'HATCHITCHI'] },
    { field: 'Sky', young: 'Rocky Young', food: null, adults: ['GEMTCHI', 'ORETATCHI', 'ISHIKOROTCHI', 'MAGMATCHI'] },
    { field: 'Jade Forest', young: 'Roar Young', food: 'Peking Meat', adults: ['FOREST HORHOTCHI', 'KONKOTCHI', 'TIGAOTCHI', 'TANOONTCHI'] },
    { field: 'Jade Forest', young: 'Toddle Young', food: 'Bamboo Grass', adults: ['LESSAPANTCHI', 'KANOKOTCHI', 'SUIGYUTCHI', 'PANBOOTCHI'] },
    { field: 'Jade Forest', young: 'Chirp Young', food: 'Pomegranate', adults: ['KACHITCHI', 'TOKIPATCHI', 'FOREST KUCHIPATCHI', 'SPARROTCHI'] },
    { field: 'Jade Forest', young: 'Sprout Young', food: null, adults: ['SHIITAKETCHI', 'PEATCHI', 'NAPPATCHI', 'RUSHRADITCHI'] },
  ];
  const BODY_GROWTH = {}, YOUNG_GROWTH = {};
  for (const path of GROWTH_PATHS) {
    path.adults.forEach((n, tier) => { BODY_GROWTH[n] = { ...path, tier }; });
    YOUNG_GROWTH[((path.field === 'Jade Forest' ? 'FOREST ' : '') + path.young).toUpperCase()] = path;
  }
  const SPECIAL_GROWTH = {
    'CHODRACOTCHI': { field: 'Land', avoid: 'Sprout Young', connect: 'Connect your Pink Land shell with a Blue Water shell and a Purple Sky shell.' },
    'MERMARINTCHI': { field: 'Water', avoid: 'Float Young', connect: 'Connect your Blue Water shell with a Pink Land shell and a Purple Sky shell.' },
    'YAYACORNTCHI': { field: 'Sky', avoid: 'Rocky Young', connect: 'Connect your Purple Sky shell with a Pink Land shell and a Blue Water shell.' },
    'TATSUTCHI': { field: 'Jade Forest', avoid: 'Sprout Young', connect: 'Connect your Jade Forest shell with two shells of different colours.' },
  };
  const KID_FIELD = { 'LAND KID': 'Land', 'WATER KID': 'Water', 'SKY KID': 'Sky', 'FOREST KID': 'Jade Forest' };
  const TIERS = [
    ['5 food and 5 happy', 'Fill the hunger meter 5 times and the happy meter 5 times, with no care mistakes.'],
    ['4 food and 4 happy, or 1 care mistake', 'Either fill the hunger meter 4 times and the happy meter 4 times, or make 1 care mistake.'],
    ['2 to 5 care mistakes', 'Make between 2 and 5 care mistakes.'],
    ['6 or more care mistakes', 'Make 6 or more care mistakes.'],
  ];
  const nice = n => n.toLowerCase().replace(/(^|\s)(\w)/g, (m, sp, ch) => sp + ch.toUpperCase());
  const normName = n => n.toUpperCase().replace(/\s+/g, ' ').trim();

  const fieldStep = f => ({
    title: `Raise the baby in the ${f} field`,
    hint: `Each 15 minutes spent in a field earns a cell for it, so spend the baby stage there.`,
  });

  // Food items that build each food cell, as listed on the growth charts.
  const FOOD_ITEMS = {
    'Meat': ['Big Meat', 'Small Meat', 'Steak'],
    'Carrot': ['Carrots', 'Shredded Carrots', 'Apples', 'Apple Pie'],
    'Worm': ['Meal Bugs', 'Meal Worms', 'Bug Cookies'],
    'Seafood': ['Seafood', 'Shellfish', 'Fried Fish', 'Grilled Fish'],
    'Seaweed': ['Green Seaweed', 'Red Seaweed', 'Seaweed Salad'],
    'Shrimp': ['Meal Shrimp', 'Meal Plankton', 'Plankton Dumpling'],
    'Chicken': ['Whole Chicken', 'Piece of Chicken', 'Chicken Steak'],
    'Corn': ['Cherry', 'Corn', 'Cherry Pie', 'Corn Flakes'],
    'Syrup': ['Flower Syrup', 'Honey Syrup', 'Flower Drops'],
    'Peking Meat': ['Chashu Pork', 'Peking Meat', 'Warm Buns'],
    'Bamboo Grass': ['Bamboo Grass', 'Sesame Leaves', 'Bamboo Leaf Rice Cake', 'Sesame Pancake'],
    'Pomegranate': ['Persimmon', 'Pomegranate', 'Che Thai'],
  };
  const joinOr = list => list.length < 2 ? list.join('') : list.slice(0, -1).join(', ') + ' or ' + list[list.length - 1];
  const foodStep = path => path.food
    ? { title: `Feed ${path.food} to lead to ${path.young}`,
        hint: `Use items like ${joinOr(FOOD_ITEMS[path.food] || [])}. Items score points, and 5 points of one food type earns a cell. Whichever food type has the most cells when it evolves decides the young form.` }
    : { title: `Keep the diet indeterminate to lead to ${path.young}`,
        hint: 'Feed only the default pellets, which carry no points, or keep an equal mix of different food types in the cell.' };

  function guideFor(entry) {
    const body = byId.get(entry.bodyId), eyes = byId.get(entry.eyesId);
    const pi = Math.max(0, pals.findIndex(p => p.Name === entry.colorName));
    const steps = [], notes = [];
    const bn = normName(body.Name);
    const B = nice(body.Name), E = nice(eyes.Name);

    // Colour source: a parent from the matching colour group.
    const group = pi === 0 ? colourGroupFor(body) : pals[pi].Name;
    const groupPi = Math.max(1, pals.findIndex(p => p.Name === group));
    const groupParents = colourChars[groupPi] || [];

    // 1. Eyes and colour come from breeding: the egg takes 2 traits from the parents.
    const eyesBreedable = eyes.Stage === 5 && eyes.Name !== 'BBMARUTCHI';
    const colourWhat = pi === 0 ? `a ${group} colour (${B}'s own)` : `the ${group} parent's colour`;
    if (eyesBreedable) {
      steps.push({
        title: `Breed ${E} with any ${group} adult`,
        hint: `The egg takes 2 traits from the parents, so it can get ${E}'s eyes and ${colourWhat}.`,
        parents: { eyes, group: groupParents, label: group },
      });
      if (eyes.IsExternal) notes.push(`${E} is a Lab Tama character, so the growth charts do not cover how to get that partner.`);
    } else {
      steps.push({
        title: `Breed any ${group} adult for the colour`,
        hint: `The egg takes 2 traits from the parents, so it can get ${colourWhat}.`,
        parents: { eyes: null, group: groupParents, label: group },
      });
      notes.push(eyes.Name === 'BBMARUTCHI'
        ? `Bbmarutchi cannot be bred with others, so its eyes cannot be passed on. They are preview only.`
        : `${E} eyes belong to a growth stage, not an adult, so they cannot be bred in. They are preview only.`);
    }

    // 2+. The body comes from how the baby is raised.
    const special = SPECIAL_GROWTH[bn];
    const info = BODY_GROWTH[bn];
    if (body.IsExternal) {
      notes.push(`${B} is a Lab Tama character, so the growth charts have no raising steps for this body.`);
    } else if (bn === 'BBMARUTCHI') {
      steps.push({ title: 'Keep the baby for 4 hours', hint: 'It evolves into Bbmarutchi after 4 hours in the baby stage.' });
      steps.push({ title: 'Keep every field cell count under 4', hint: 'Switch Tama fields just before the 15 minute mark so no single field type reaches 4 cells.' });
      notes.push('Bbmarutchi looks like Babymarutchi but is already an adult, and it cannot be bred with others.');
    } else if (special) {
      steps.push(fieldStep(special.field));
      steps.push({ title: 'Pick one food type for the young stage', hint: `Any single food type works. A mixed diet makes ${special.avoid}, and ${B} cannot evolve from that.` });
      steps.push({ title: 'Connect shells during the young stage', hint: special.connect });
    } else if (info) {
      steps.push(fieldStep(info.field));
      steps.push(foodStep(info));
      const [t, h] = TIERS[info.tier];
      steps.push({ title: `Care for it: ${t}`, hint: h });
    } else if (body.Stage === 4 && YOUNG_GROWTH[bn]) {
      const path = YOUNG_GROWTH[bn];
      steps.push(fieldStep(path.field));
      steps.push(foodStep(path));
      notes.push(`${B} is a young stage, not a final form. Keep raising it with good care to reach an adult.`);
    } else if (body.Stage === 3 && KID_FIELD[bn]) {
      steps.push(fieldStep(KID_FIELD[bn]));
      notes.push(`${B} is a kid stage, not a final form. It appears after the baby stage in that field.`);
    } else if (body.Stage < 3) {
      notes.push(`${B} is the baby stage, so there is nothing to raise. It is the starting point.`);
    } else {
      notes.push(`There is no growth data for ${B} yet.`);
    }
    return { body, eyes, group, steps, notes };
  }

  const guideDialog = document.getElementById('guide');
  let guideKey = null, guideEntry = null;
  function parentChip(c, extra = '') {
    return `<div class="parent${extra}" title="${esc(nice(c.Name))}"><canvas data-thumb="${c.Id}" aria-hidden="true"></canvas><span>${esc(nice(c.Name))}</span></div>`;
  }
  function openGuide(key, keepScroll) {
    const entry = state.history.get(key) || state.favorites.get(key);
    if (!entry) return;
    guideKey = key; guideEntry = entry;
    const g = guideFor(entry);
    const fav = state.favorites.get(key);
    const titleText = fav && fav.nickname ? `${fav.nickname} the ${nice(g.body.Name)}` : nice(g.body.Name);
    const items = g.steps.map(st => {
      let parents = '';
      if (st.parents) {
        parents = '<div class="parents">'
          + (st.parents.eyes ? parentChip(st.parents.eyes, ' eyes-parent') + '<span class="sep">+</span>' : '')
          + (st.parents.group.length
            ? st.parents.group.map(c => parentChip(c)).join('')
            : `<span class="sep">No adult ${esc(st.parents.label)} characters</span>`)
          + '</div>';
      }
      return `<li><div class="step-title">${esc(st.title)}</div><p class="step-hint">${esc(st.hint)}</p>${parents}</li>`;
    }).join('');
    guideDialog.innerHTML = `
      <div class="guide-head">
        <canvas id="guide-final" aria-hidden="true"></canvas>
        <div>
          <div class="guide-name"><h3 id="guide-title">${esc(titleText)}</h3>${heartBtn(key)}${editBtn(key)}</div>
          <p>Eyes: ${esc(nice(g.eyes.Name))}<br>Body: ${esc(entry.colorName)}</p>
        </div>
        <button type="button" class="guide-close" data-close aria-label="Close">✕</button>
      </div>
      <div class="guide-body">
        <ol>${items}</ol>
        ${g.notes.map(n => `<p class="guide-note">${esc(n)}</p>`).join('')}
        <p class="guide-source">Source: Official Tamagotchi Paradise growth charts.</p>
      </div>`;
    guideDialog.querySelectorAll('canvas[data-thumb]').forEach(cv => drawInto(cv, thumb(byId.get(Number(cv.dataset.thumb)))));
    drawInto(document.getElementById('guide-final'), entry.canvas);
    if (!keepScroll) guideDialog.scrollTop = 0;
    if (!guideDialog.open) guideDialog.showModal();
  }
  guideDialog.addEventListener('click', e => {
    const heart = e.target.closest('[data-fav-toggle]');
    if (heart) {
      toggleFavorite(guideKey, guideEntry);
      render();                                   // refresh hearts and the Favorites count behind the popup
      return openGuide(guideKey, true);
    }
    const edit = e.target.closest('[data-edit]');
    if (edit) { guideDialog.close(); return editEntry(edit.dataset.edit); }
    if (e.target === guideDialog || e.target.closest('[data-close]')) guideDialog.close();
  });

  const app = document.getElementById('app');
  const openPickers = new Set(); // keep <details> open across re-renders

  const checkHtml = (id, label, checked) =>
    `<label class="tgl"><input type="checkbox" data-opt="${id}"${checked ? ' checked' : ''}><span>${label}</span></label>`;

  function pickerHtml(label, key, list, selected) {
    const isEyes = key === 'eyes';
    const thumbAttr = id => isEyes ? `class="eyes-thumb" data-eyes-thumb="${id}"` : `data-thumb="${id}"`;
    const badge = selected
      ? `<div class="selected-badge"><canvas ${thumbAttr(selected.Id)}></canvas>${esc(selected.Name)}</div>`
      : '';
    const q = (state.search[key] || '').trim().toLowerCase();
    const shown = q ? list.filter(c => c.Name.toLowerCase().includes(q)) : list;
    const cards = shown.map(c => `
      <button type="button" class="tama-card${selected && c.Id === selected.Id ? ' selected' : ''}" data-pick="${key}" data-id="${c.Id}" title="${esc(c.Name)}">
        <canvas ${thumbAttr(c.Id)}></canvas>
        <span class="label">${esc(c.Name)}</span>
      </button>`).join('');
    const optIds = isEyes ? ['nonBreedableEyes', 'externalEyes'] : ['nonBreedableBodies', 'externalBodies'];
    const includeRow = `<div class="mood-row"><span class="mood-label">Include</span><div class="fchips">${checkHtml(optIds[0], 'Non-breedable', opts[optIds[0]])}${checkHtml(optIds[1], 'Lab Tama', opts[optIds[1]])}</div></div>`;
    const nFilters = (isEyes ? state.mood.size : state.stars.size + state.types.size) + (opts[optIds[0]] ? 1 : 0) + (opts[optIds[1]] ? 1 : 0);
    const fopen = !!state.filtersOpen[key];
    let moodRow = '';
    if (!isEyes) {
      const base = chars.filter(charaFilter).filter(bodyBase);
      const careRow = `<div class="mood-row" role="group" aria-label="Care level"><span class="mood-label">Care</span><div class="fchips">${STAR_LEVELS.map(([n, tip]) =>
        `<button type="button" class="chip" data-stars="${n}" aria-pressed="${state.stars.has(n)}" aria-label="${n === 'special' ? '' : n + ' stars: '}${esc(tip)}" title="${esc(tip)}">${n === 'special' ? 'Special' : '★'.repeat(n)} <span class="chip-n">${base.filter(matchesType).filter(c => careOf(c) === n).length}</span></button>`).join('')}</div></div>`;
      const typeRow = `<div class="mood-row" role="group" aria-label="Body type"><span class="mood-label">Type</span><div class="fchips">${BODY_TYPES.map(([id, name, tip]) =>
        `<button type="button" class="chip" data-type="${id}" aria-pressed="${state.types.has(id)}" title="${esc(tip)}">${name} <span class="chip-n">${base.filter(matchesCare).filter(c => typeOf(c) === id).length}</span></button>`).join('')}</div></div>`;
      moodRow = careRow + typeRow;
    }
    if (isEyes) {
      const base = chars.filter(charaFilter).filter(eyesBase);
      moodRow = `<div class="mood-row" role="group" aria-label="Eye style"><span class="mood-label">Style</span><div class="fchips">${MOODS.map(([id, name, tip]) =>
        `<button type="button" class="chip" data-mood="${id}" aria-pressed="${state.mood.has(id)}" title="${esc(tip)}">${name} <span class="chip-n">${base.filter(c => eyesTags(c).includes(id)).length}</span></button>`).join('')}</div></div>`;
    }
    return `
      <div class="pick-card" data-card="${key}">
        <div class="pick-head">
          <h3 class="pick-title">${label}</h3>
          <button type="button" class="ftoggle${nFilters ? ' on' : ''}" data-fopen="${key}" aria-expanded="${fopen}">Filters${nFilters ? ` <span class="fcount">${nFilters}</span>` : ''}</button>
        </div>
        <div class="badge-row"><button type="button" class="dice-btn" data-action="${isEyes ? 'rand-eyes' : 'rand-body'}" aria-label="Random ${label.toLowerCase()}" title="Random ${label.toLowerCase()}">🎲</button>${badge}</div>
        <div class="filters-panel"${fopen ? '' : ' hidden'}>${includeRow}${moodRow}</div>
        <details class="picker" data-details="${key}"${openPickers.has(key) ? ' open' : ''}>
          <summary>Browse ${label.toLowerCase()} (${list.length})</summary>
          <div class="pick-search-wrap"><input type="search" class="pick-search" data-search="${key}" value="${esc(state.search[key] || '')}" placeholder="Search ${label.toLowerCase()} by name" aria-label="Search ${label.toLowerCase()} by name" autocomplete="off"></div>
          <p class="pick-empty" data-empty="${key}"${shown.length ? ' hidden' : ''}>No ${label.toLowerCase()} match that name.</p>
          <div class="tama-grid${isEyes ? ' eyes-grid' : ''}">${cards}</div>
        </details>
      </div>`;
  }

  function colorPickerHtml() {
    const sel = pals[state.colorIdx];
    const rows = pals.map((p, i) => {
      const members = colourChars[i];
      const thumbs = i === 0
        ? '<span class="cnone">Each character keeps its own colours</span>'
        : members.length
          ? members.map(c => `<canvas data-thumb="${c.Id}" title="${esc(c.Name)}"></canvas>`).join('')
          : '<span class="cnone">No adult characters</span>';
      return `
        <button type="button" class="color-item${i === state.colorIdx ? ' selected' : ''}" data-pick="color" data-idx="${i}" aria-label="${esc(p.Name)}">
          <canvas class="swatch" data-swatch="${i}" aria-hidden="true"></canvas>
          <span class="cname">${esc(p.Name)}</span>
          <span class="cthumbs" aria-hidden="true">${thumbs}</span>
        </button>`;
    }).join('');
    return `
      <div class="pick-card" data-card="color">
      <div class="pick-head"><h3 class="pick-title">Color palette</h3></div>
      <div class="badge-row"><button type="button" class="dice-btn" data-action="rand-color" aria-label="Random colour" title="Random colour">🎲</button><div class="selected-badge"><canvas class="swatch" data-swatch="${state.colorIdx}" aria-hidden="true"></canvas>${esc(sel.Name)}</div></div>
      <details class="picker" data-details="color"${openPickers.has('color') ? ' open' : ''}>
        <summary>Browse colors (${pals.length})</summary>
        <div class="color-list">${rows}</div>
      </details>
      </div>`;
  }

  function render() {
    const scrollY = window.scrollY;
    const gridScroll = {};
    app.querySelectorAll('[data-details]').forEach(d => { const sc = d.querySelector('.tama-grid, .color-list'); gridScroll[d.dataset.details] = sc ? sc.scrollTop : 0; });
    refreshLists();
    const current = addHistory();
    const color = pals[state.colorIdx];
    const [h1, h2] = state.headerTamas;

    const histList = [...state.history.entries()].reverse().slice(0, HISTORY_SHOWN);
    const nSel = [...state.selected].filter(k => state.history.has(k)).length;

    const check = checkHtml;

    app.innerHTML = `
      <header>
        <div class="title-row">
          <canvas data-thumb="${h1.Id}" aria-hidden="true"></canvas>
          <h1>Tamagotchi Paradise Genes Generator</h1>
          <canvas data-thumb="${h2.Id}" aria-hidden="true"></canvas>
        </div>
        <div class="credit">created by <a href="https://github.com/scalynko/tamaparagenerator" target="_blank" rel="noopener">Scalynko</a>
          &nbsp;/&nbsp; modified by <em>Iceomort</em> (${APP_UPDATED})
          &nbsp;/&nbsp; ${APP_VERSION}</div>
      </header>

      <div class="layout">
        <aside class="stage" aria-label="Preview">
          <div class="preview-card">
            <div class="preview-stage">${current ? '<canvas id="preview-large"></canvas>' : '<div class="empty">No characters match the current filters.</div>'}</div>
            ${current ? `<p class="caption"><strong>${esc(state.body.Name)}</strong> body × <strong>${esc(state.eyes.Name)}</strong> eyes, ${esc(color.Name)}</p>` : ''}
            <button type="button" class="btn primary" data-action="rand-all">🎲 Randomise All</button>
          </div>
        </aside>
        <div class="controls">
          <section class="biomes" aria-label="Options">
            <span class="mood-label">Biomes</span>
            <div class="fchips">
              ${check('land', '🌿 Land', opts.land)}
              ${check('water', '💧 Water', opts.water)}
              ${check('sky', '☁️ Sky', opts.sky)}
              ${check('jade', '🎋 Jade', opts.jade)}
            </div>
          </section>
          <section class="pick-grid" aria-label="Pickers">
            ${pickerHtml('Body', 'body', bodiesList, state.body)}
            ${pickerHtml('Eyes', 'eyes', eyesList, state.eyes)}
          </section>
          ${colorPickerHtml()}
        </div>
      </div>

      <div class="section-tabs" role="group" aria-label="Saved characters">
        <button type="button" data-view="history" aria-pressed="${state.view === 'history'}">History</button>
        <button type="button" data-view="favorites" aria-pressed="${state.view === 'favorites'}">Favorites (${state.favorites.size})</button>
      </div>
      ${state.view === 'favorites' ? favoritesHtml() : histList.length ? `
        <p class="hist-hint">Click a character to see how to grow it.</p>
        <div class="history-actions">
          <button type="button" class="btn" data-action="delete-selected"${nSel ? '' : ' disabled'}>🗑️ Delete selected (${nSel})</button>
          <button type="button" class="btn" data-action="rand-selected"${nSel ? '' : ' disabled'}>🎲 Randomise selected (${nSel})</button>
          <button type="button" class="btn" data-action="clear-history">✕ Clear all history</button>
        </div>
        <div class="history-grid">
          ${histList.map(([k, v]) => `
            <div class="history-item">
              <label class="check"><input type="checkbox" data-hist="${esc(k)}"${state.selected.has(k) ? ' checked' : ''} aria-label="Select ${esc(byId.get(v.bodyId).Name)} × ${esc(byId.get(v.eyesId).Name)}"></label>
              <button type="button" class="hist-open" data-guide="${esc(k)}" title="How to grow this" aria-label="How to grow ${esc(byId.get(v.bodyId).Name)} with ${esc(byId.get(v.eyesId).Name)} eyes in ${esc(v.colorName)}"><canvas data-hist-canvas="${esc(k)}"></canvas></button>
              <div class="cap"><span class="cap-name">${esc(byId.get(v.bodyId).Name)} ${heartBtn(k, true)}${editBtn(k, true)}</span><span>Eyes: ${esc(byId.get(v.eyesId).Name)}</span><span>Body: ${esc(v.colorName)}</span></div>
            </div>`).join('')}
        </div>` : '<div class="empty">No history yet.</div>'}

      <footer>Original Generator created by <a href="https://github.com/scalynko/tamaparagenerator" target="_blank" rel="noopener">Scalynko</a>. I just made some edits! - ice</footer>
    `;

    // paint canvases
    app.querySelectorAll('canvas[data-thumb]').forEach(cv => drawInto(cv, thumb(byId.get(Number(cv.dataset.thumb)))));
    app.querySelectorAll('canvas[data-swatch]').forEach(cv => drawInto(cv, swatch(Number(cv.dataset.swatch))));
    app.querySelectorAll('canvas[data-eyes-thumb]').forEach(cv => drawInto(cv, eyesThumb(byId.get(Number(cv.dataset.eyesThumb)))));
    app.querySelectorAll('canvas[data-fav-canvas]').forEach(cv => drawInto(cv, state.favorites.get(cv.dataset.favCanvas).canvas));
    app.querySelectorAll('canvas[data-hist-canvas]').forEach(cv => drawInto(cv, state.history.get(cv.dataset.histCanvas).canvas));
    if (current) {
      drawInto(document.getElementById('preview-large'), current.canvas);
    }
    app.querySelectorAll('[data-details]').forEach(d => { const sc = d.querySelector('.tama-grid, .color-list'); if (sc) sc.scrollTop = gridScroll[d.dataset.details] || 0; });
    window.scrollTo(0, scrollY);
    const renameInput = app.querySelector('[data-rename-input]');
    if (renameInput) { renameInput.focus({ preventScroll: true }); renameInput.select(); }
  }

  // ── Events (delegated, so re-rendering never loses handlers) ──────────────
  app.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      if (pick.dataset.pick in state.search) state.search[pick.dataset.pick] = '';
      if (pick.dataset.pick === 'color') state.colorIdx = Number(pick.dataset.idx);
      else if (pick.dataset.pick === 'body') state.body = byId.get(Number(pick.dataset.id));
      else state.eyes = byId.get(Number(pick.dataset.id));
      return render();
    }
    const fOpen = e.target.closest('[data-fopen]');
    if (fOpen) { const k = fOpen.dataset.fopen; state.filtersOpen[k] = !state.filtersOpen[k]; return render(); }
    const editEl = e.target.closest('[data-edit]');
    if (editEl) return editEntry(editEl.dataset.edit);
    const favBtn = e.target.closest('[data-fav-toggle]');
    if (favBtn) { toggleFavorite(favBtn.dataset.favToggle); return render(); }
    const typeBtn = e.target.closest('[data-type]');
    if (typeBtn) {
      const t = typeBtn.dataset.type;
      if (state.types.has(t)) state.types.delete(t); else state.types.add(t);
      return render();
    }
    const starBtn = e.target.closest('[data-stars]');
    if (starBtn) {
      const n = starBtn.dataset.stars === 'special' ? 'special' : Number(starBtn.dataset.stars);
      if (state.stars.has(n)) state.stars.delete(n); else state.stars.add(n);
      return render();
    }
    const moodBtn = e.target.closest('[data-mood]');
    if (moodBtn) {
      const m = moodBtn.dataset.mood;
      if (state.mood.has(m)) state.mood.delete(m); else state.mood.add(m);
      return render();
    }
    const viewBtn = e.target.closest('[data-view]');
    if (viewBtn) { state.view = viewBtn.dataset.view; state.renaming = null; return render(); }
    const renameBtn = e.target.closest('[data-fav-rename]');
    if (renameBtn) { state.renaming = renameBtn.dataset.favRename; return render(); }
    const saveBtn = e.target.closest('[data-fav-save]');
    if (saveBtn) { saveRename(saveBtn.dataset.favSave); return render(); }
    if (e.target.closest('[data-fav-cancel]')) { state.renaming = null; return render(); }
    const guideBtn = e.target.closest('[data-guide]');
    if (guideBtn) return openGuide(guideBtn.dataset.guide);
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    switch (btn.dataset.action) {
      case 'rand-body': if (bodiesList.length) state.body = choice(bodiesList); break;
      case 'rand-eyes': if (eyesList.length) state.eyes = choice(eyesList); break;
      case 'rand-color': state.colorIdx = randInt(pals.length); break;
      case 'rand-all':
        if (bodiesList.length) state.body = choice(bodiesList);
        if (eyesList.length) state.eyes = choice(eyesList);
        state.colorIdx = randInt(pals.length);
        break;
      case 'delete-selected':
        state.selected.forEach(k => state.history.delete(k));
        state.selected.clear();
        saveHistory();
        break;
      case 'rand-selected': randomiseSelected(); break;
      case 'clear-history':
        state.history.clear();
        state.selected.clear();
        saveHistory();
        break;
    }
    render();
  });

  app.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.opt) { opts[t.dataset.opt] = t.checked; return render(); }
    if (t.dataset.hist) {
      if (t.checked) state.selected.add(t.dataset.hist); else state.selected.delete(t.dataset.hist);
      return render();
    }
  });

  // Picker search filters the cards in place, so typing never re-renders the page or drops focus.
  app.addEventListener('input', e => {
    const key = e.target.dataset && e.target.dataset.search;
    if (!key) return;
    state.search[key] = e.target.value;
    const q = e.target.value.trim().toLowerCase();
    const root = e.target.closest('details');
    let visible = 0;
    root.querySelectorAll('.tama-card').forEach(card => {
      const hit = !q || card.title.toLowerCase().includes(q);
      card.hidden = !hit;
      if (hit) visible++;
    });
    root.querySelector('[data-empty]').hidden = visible > 0;
  });

  app.addEventListener('keydown', e => {
    const input = e.target.closest && e.target.closest('[data-rename-input]');
    if (!input) return;
    if (e.key === 'Enter') { e.preventDefault(); saveRename(input.dataset.renameInput); render(); }
    if (e.key === 'Escape') { e.preventDefault(); state.renaming = null; render(); }
  });

  app.addEventListener('toggle', e => {
    const d = e.target.closest && e.target.closest('[data-details]');
    if (!d) return;
    if (d.open) openPickers.add(d.dataset.details); else openPickers.delete(d.dataset.details);
  }, true);

  restoreHistory();
  restoreFavorites();
  render();
  window.__tama = { render, editEntry, toggleFavorite, guideFor, openGuide, generate, state, pals, chars, sprites, palettes }; // handy for debugging in the console
}

boot().catch(err => {
  document.getElementById('app').innerHTML =
    `<div class="loading">Could not load the generator: ${esc(err.message)}.<br>If you opened this file directly, serve it over http (see README) or use the GitHub Pages link.</div>`;
});
</script>
</body>
</html>
